    <h1 id="Tudu">To Do List</h1>
    <div id="to-do"> <input type="text" id="taskInput" placeholder="Add a task"> 
    <button id="taskbtn">Add</button>
    <ul id="tasklist"></ul>
    </div>

   <script>
        const navbar = document.getElementById("navbar");
        const menuToggle = document.getElementById("menu-toggle");

        // 2. Listen for clicks on the button
        menuToggle.addEventListener("click", function() {

            // 3. Toggle the expanded class
            navbar.classList.toggle("expanded");

            // 4. Update the accessibility state
            const isExpanded = navbar.classList.contains("expanded");
            menuToggle.setAttribute("aria-expanded", isExpanded);

        });
        const input=document.getElementById("taskInput");
        const tbtn = document.getElementById("taskbtn");
        const lis = document.getElementById("tasklist");
        const tasks = JSON.parse(localStorage.getItem("tasks")) || [];
        function addtasks (taks){
            const li = document.createElement("li");
            li.textContent = taks;
            lis.appendChild(li);
            input.value = "";
        }
        tasks.forEach(addtasks);
        tbtn.addEventListener("click", () =>{
            const text = input.value.trim();
            if (text === "") return;
            tasks.push(text);
            addtasks(tasks);
            localStorage.setItem("tasks",JSON.stringify(tasks)); 
        })
        lis.addEventListener("click", (event) => {
        const li = event.target.closest("li");
            if (!li) return;
            li.classList.toggle("done");
    });
        
   </script>
</body>
