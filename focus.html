    <div>
        <h1>Focus</h1>
        <div class="circle">
            <p id = "clock">00:00</p>
        </div>

        <input class="picktime" type="number" id="focus-time" placeholder="Enter focus time in minutes">
        <button class="picktime" id="start-focus">Start Focus</button>
    
    </div>
   <script>
    const navbar = document.getElementById("navbar");
    const menuToggle = document.getElementById("menu-toggle");

    // 2. Listen for clicks on the button
    menuToggle.addEventListener("click", function() {

        // 3. Toggle the expanded class
        navbar.classList.toggle("expanded");

        // 4. Update the accessibility state
        const isExpanded = navbar.classList.contains("expanded");
        menuToggle.setAttribute("aria-expanded", isExpanded);

    });
    let inputField = document.getElementById("focus-time");
    let submitButton = document.getElementById("start-focus");
    let di = document.getElementById("clock");
    const delay = ms => new Promise(res => setTimeout(res,ms)); // 1 second delay
    let n = 0;
    submitButton.addEventListener("click",()=>{
        timer();

    })
    async function timer (){
        while (inputField.value >0 || n > 0 ){
            if (n<0){
                n=59;
                inputField.value --;
            }
            if (n<10){
                di.textContent = inputField.value + ":0" + n; 
            }
            else{
                di.textContent = inputField.value + ":" + n; 
            }
            n--;
            await delay(1000);
        }
        di.textContent = "00:00"
    }

   </script>
